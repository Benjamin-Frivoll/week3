        <!DOCTYPE html>
        <html>
        <head>
            <title>Login</title>

            <style>
                .hidemessage {
                    display: none;
                }

                .showmessage {
                    display: block;
                }
            </style>
        </head>

        <body>
            <h1>Login</h1>

            <form id="loginForm">

                <label>Email:</label>
                <input 
                    type="email" 
                    id="email" 
                    required
                >

                <br><br>

                <label>Password:</label>
                <input 
                    type="password" 
                    id="password" 
                    required
                >

                <br><br>

                <button type="submit">Login</button>

            </form>

            <div id="errormsg" class="hidemessage">
                User credentials do not match
            </div>

            <script>

                const loginForm = document.getElementById('loginForm');

                loginForm.addEventListener('submit', async (event) => {

                    event.preventDefault();                 //stops default/i can choose what happends

                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;

                    const response = await fetch('/login/attempt', {

                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })

                    });

                    const result = await response.json();   //await "stops" everything and waits for an answer

                    const errorMessage = document.getElementById('errormsg');

                    if (result.ok === false) {

                        errorMessage.classList.remove('hidemessage');

                        errorMessage.classList.add('showmessage');

                    } else {

                        errorMessage.classList.remove('showmessage');

                        errorMessage.classList.add('hidemessage');

                        window.location.href = '/account';

                    }

                });

            </script>

        </body>
        </html>
